[build-system]
requires = ["setuptools>=61.0", "Cython"]
build-backend = "setuptools.build_meta"

[project]
name = "kishi-shell"
version = "2.0.2.4"
description = "A powerful, highly modular, Python-based modern shell."
readme = "README.md"
license = "GPL-3.0-only"
requires-python = ">=3.8"
authors = [
    { name = "Ozhan Gebesoglu", email = "ozhan.gebesoglu@gmail.com" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
    "Environment :: Console",
]
dependencies = [
    "prompt_toolkit>=3.0.0",
    "psutil>=5.0.0",
]

[project.optional-dependencies]
# Krep AI'ın LSA modeli (--learn, --update-learn, --auto-refresh) için.
# Keyword tabanlı krep çekirdek arama bu paketler olmadan da çalışır.
# Kurulum: pip install kishi-shell[krep]
krep = [
    "numpy>=1.20",
    "scipy>=1.7",
]

[project.urls]
Homepage = "https://github.com/ozhangebesoglu/Kishi-Shell"
Repository = "https://github.com/ozhangebesoglu/Kishi-Shell"
Issues = "https://github.com/ozhangebesoglu/Kishi-Shell/issues"

[project.scripts]
kishi = "kishi.main:main"
krep  = "kishi.krep_cli:main"

[tool.setuptools.packages.find]
include = ["kishi*"]

[tool.pytest.ini_options]
testpaths = ["tests"]


# ─────────────────────────────────────────────────────────────────────────
# cibuildwheel — multi-platform wheel matrix
# ─────────────────────────────────────────────────────────────────────────
# Her release'de Linux (manylinux + musllinux), macOS (Intel + ARM64),
# Windows (amd64) × Python 3.9, 3.10, 3.11, 3.12, 3.13 için pre-built
# wheel üretir. Kullanıcı 'pip install kishi-shell' yaptığında derleme
# yapmadan ~3 saniyede kurulur.
#
# Build aracı: pypa/cibuildwheel GitHub Action
# Konfig dokümantasyonu: https://cibuildwheel.pypa.io/
[tool.cibuildwheel]
# Test bağımlılıkları (her wheel sonrası pytest ile doğrula)
test-requires = ["pytest"]
test-command = "pytest {project}/tests/test_krep.py -v"

# Hangi Python sürümleri için wheel üret
# CPython 3.9-3.13 (PyPy şu an dışarıda, ileride eklenebilir)
build = "cp39-* cp310-* cp311-* cp312-* cp313-*"

# Atlanan platformlar (Krep Linux/Mac/Win odaklı)
skip = [
    "pp*",          # PyPy
    "*-musllinux_i686",
    "*-manylinux_i686",
    "*-win32",
]

# Linux: manylinux2014 standardı (CentOS 7+ glibc 2.17 üstü her dağıtım)
manylinux-x86_64-image = "manylinux2014"
manylinux-aarch64-image = "manylinux2014"
musllinux-x86_64-image = "musllinux_1_2"

# Cython source dist'ten gelecek; Cython explicit dep gerekiyor
# (pyproject [build-system].requires zaten ekledi, ama cibuildwheel
# isolation'da net olsun diye)
before-build = "pip install Cython"

# macOS: yalnızca Apple Silicon (arm64). Intel Mac kullanıcıları (%10-15)
# sdist'ten kurar — Xcode CLT'leri zaten var, ~15 saniye.
[tool.cibuildwheel.macos]
archs = ["arm64"]

# Windows: 64-bit
[tool.cibuildwheel.windows]
archs = ["AMD64"]

# Linux: yalnızca x86_64. ARM Linux kullanıcısı azdır (Raspberry Pi,
# AWS Graviton). Onlarda gcc zaten standart olduğu için sdist'ten
# ~15 saniyede derlerler. aarch64 QEMU build'i CI'da 5+ saat alıyordu.
[tool.cibuildwheel.linux]
archs = ["x86_64"]
