name: Release & Publish

on:
  push:
    tags:
      - "v*"

jobs:
  # ─────────────────────────────────────────────────────────────────
  # Test on every supported Python version + Linux
  # ─────────────────────────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install system dependencies (ripgrep for krep tests)
        run: sudo apt-get update -qq && sudo apt-get install -y ripgrep
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[krep]" 2>/dev/null || pip install -e .
          pip install pytest
      - run: python -m pytest tests/ -v

  # ─────────────────────────────────────────────────────────────────
  # Build wheels for every platform × Python version
  # cibuildwheel handles manylinux Docker, macOS arm64, Windows MSVC
  # ─────────────────────────────────────────────────────────────────
  build-wheels:
    needs: test
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-13, macos-14]
        # macos-13 = Intel, macos-14 = Apple Silicon (M1)
    steps:
      - uses: actions/checkout@v4

      - name: Build wheels via cibuildwheel
        uses: pypa/cibuildwheel@v2.21.3
        # Tüm cibuildwheel ayarı pyproject.toml [tool.cibuildwheel]'de
        # Not: ARM64 (aarch64) build'i QEMU üzerinden saatler sürüyordu;
        # Linux ARM kullanıcıları sdist'ten gcc ile derlerler (~15 sn).

      - name: Upload wheel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl

  # ─────────────────────────────────────────────────────────────────
  # Build sdist (source distribution)
  # ─────────────────────────────────────────────────────────────────
  build-sdist:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build --sdist
      - name: Upload sdist artifact
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: ./dist/*.tar.gz

  # ─────────────────────────────────────────────────────────────────
  # Publish all wheels + sdist to PyPI in one shot
  # ─────────────────────────────────────────────────────────────────
  publish:
    needs: [build-wheels, build-sdist]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    environment: pypi
    steps:
      - name: Download all wheel + sdist artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./dist
          merge-multiple: true

      - name: List artifacts
        run: ls -la ./dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  # ─────────────────────────────────────────────────────────────────
  # GitHub Release with auto-generated notes
  # ─────────────────────────────────────────────────────────────────
  github-release:
    needs: [build-wheels, build-sdist]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true

  # ─────────────────────────────────────────────────────────────────
  # AUR publish (Arch Linux)
  # ─────────────────────────────────────────────────────────────────
  aur-publish:
    needs: github-release
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    steps:
      - name: Install dependencies
        run: pacman -Syu --noconfirm git openssh curl awk sudo

      - name: Set up SSH Private Key
        env:
          SSH_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          ssh-keygen -y -f ~/.ssh/aur > /dev/null

      - name: Clone AUR Repo
        env:
          GIT_SSH_COMMAND: "ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o PubkeyAcceptedKeyTypes=+ssh-ed25519 -i ~/.ssh/aur"
        run: git clone ssh://aur@aur.archlinux.org/kishi-shell.git aur-repo

      - name: Update PKGBUILD and Push
        run: |
          cd aur-repo

          VERSION="${GITHUB_REF_NAME#v}"
          TARBALL_URL="https://github.com/ozhangebesoglu/Kishi-Shell/archive/refs/tags/${GITHUB_REF_NAME}.tar.gz"
          TARBALL_HASH=$(curl -sL $TARBALL_URL | sha256sum | awk '{print $1}')

          sed -i "s/^pkgver=.*/pkgver=$VERSION/" PKGBUILD
          sed -i "s/^pkgrel=.*/pkgrel=1/" PKGBUILD
          sed -i "s/^sha256sums=('.*')/sha256sums=('$TARBALL_HASH')/" PKGBUILD

          useradd builder -m
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers

          mkdir -p /home/builder/.ssh
          cp ~/.ssh/aur /home/builder/.ssh/aur
          chown -R builder:builder /home/builder/.ssh
          chmod 600 /home/builder/.ssh/aur

          chown -R builder:builder .

          sudo -u builder makepkg --printsrcinfo > .SRCINFO

          sudo -u builder git config user.name "github-actions[bot]"
          sudo -u builder git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          sudo -u builder git add PKGBUILD .SRCINFO
          sudo -u builder git commit -m "chore: Auto-update to ${GITHUB_REF_NAME}" || echo "No changes to commit"

          sudo -u builder GIT_SSH_COMMAND="ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o PubkeyAcceptedKeyTypes=+ssh-ed25519 -i /home/builder/.ssh/aur" git push
